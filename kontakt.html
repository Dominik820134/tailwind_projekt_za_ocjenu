<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glazbeni kutak Dominik - Kontakt</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <header class="sticky top-0 bg-white border-b border-gray-200 z-10">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-purple-700 hover:text-purple-800">Glazbeni kutak Dominik</a>
            <nav class="hidden md:flex gap-6">
                <a href="index.html" class="hover:text-purple-700">Naslovnica</a>
                <a href="usluge.html" class="hover:text-purple-700">Usluge</a>
                <a href="kontakt.html" class="font-semibold text-purple-700 hover:text-purple-900">Kontakt</a>
            </nav>
        </div>
    </header>

    <nav class="md:hidden bg-white border-b border-gray-200">
        <div class="flex justify-around py-2 text-sm">
            <a href="index.html" class="hover:text-purple-700">Naslovnica</a>
            <a href="usluge.html" class="hover:text-purple-700">Usluge</a>
            <a href="kontakt.html" class="font-semibold text-purple-700">Kontakt</a>
        </div>
    </nav>

    <main class="flex-grow">
        <section class="max-w-2xl mx-auto px-4 py-12">
            <h1 class="text-2xl font-bold mb-6">Kontaktirajte nas</h1>

            <form class="flex flex-col gap-4">

                <div class="flex flex-col md:flex-row gap-4">

                    <div class="flex flex-col gap-1 w-full">
                        <label for="name" class="text-sm font-medium">Ime i prezime</label>
                        <input type="text" id="name" name="name" placeholder="Vaše ime" required
                            class="border border-gray-300 rounded-md px-3 py-2 focus:border-purple-600 focus:ring-1 focus:ring-purple-600 focus:outline-none">
                    </div>

                    <div class="flex flex-col gap-1 w-full">
                        <label for="email" class="text-sm font-medium">E-mail adresa</label>
                        <input type="email" id="email" name="email" placeholder="ime@primjer.com" required
                            class="border border-gray-300 rounded-md px-3 py-2 focus:border-purple-600 focus:ring-1 focus:ring-purple-600 focus:outline-none">
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label for="subject" class="text-sm font-medium">Naslov poruke / Predmet</label>
                    <input type="text" id="subject" name="subject" placeholder="Npr. Narudžba ploča ili servis" required
                        class="border border-gray-300 rounded-md px-3 py-2 focus:border-purple-600 focus:ring-1 focus:ring-purple-600 focus:outline-none">
                </div>

                <div class="flex flex-col gap-1">
                    <label for="message" class="text-sm font-medium">Vaša poruka</label>
                    <textarea id="message" name="message" rows="4" placeholder="Napišite svoju poruku..." required
                        class="border border-gray-300 rounded-md px-3 py-2 focus:border-purple-600 focus:ring-1 focus:ring-purple-600 focus:outline-none"></textarea>
                </div>

                <button type="submit"
                    class="bg-purple-700 text-white font-semibold px-6 py-3 rounded-lg hover:bg-purple-800 transition-colors">
                    Pošalji poruku
                </button>

            </form>
        </section>
    </main>

    <footer class="bg-gray-800 text-gray-300">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between gap-4 text-sm">
            <p>Glazbeni kutak, Trg ploča 3, Koprivnica</p>
            <p>Radnim danom 10:00 - 20:00, subotom 9:00 - 14:00</p>
        </div>
    </footer>

</body>

</html>
